        impact: &#x27;Constituye el escenario apuesta y la Visión 2035 de la investigación.&#x27; 
      }
    };

    function toggleTheme() {
      document.body.classList.toggle(&#x27;dark-theme&#x27;);
      const isDark = document.body.classList.contains(&#x27;dark-theme&#x27;);
      document.getElementById(&#x27;themeBtn&#x27;).innerText = isDark ? &#x27;Modo Claro&#x27; : &#x27;Modo Oscuro&#x27;;
    }

    function openModal(key) {
      const info = dataModal[key];
      if (!info) return;

      document.getElementById(&#x27;m-tag&#x27;).innerText = info.tag;
      document.getElementById(&#x27;m-title&#x27;).innerText = info.title;
      document.getElementById(&#x27;m-desc&#x27;).innerText = info.desc;
      document.getElementById(&#x27;m-metrics&#x27;).innerText = info.metrics;
      document.getElementById(&#x27;m-impact&#x27;).innerText = info.impact;

      document.getElementById(&#x27;detailModal&#x27;).classList.add(&#x27;active&#x27;);
    }

    function closeModal() {
      document.getElementById(&#x27;detailModal&#x27;).classList.remove(&#x27;active&#x27;);
